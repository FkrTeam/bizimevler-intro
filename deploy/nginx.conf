# nginx — scroll-scrubbed video site.
# Drop this inside your existing server { } block, or adapt paths.

server {
    listen 443 ssl;
    http2 on;                      # multiplexing matters: the video competes
                                   # with HTML/CSS/JS on the same connection
    server_name example.com;

    root /var/www/katman/dist;
    index index.html;

    # ---- Byte-range requests -------------------------------------------------
    # This is the single most important setting for a scrubbed video. Without
    # range support the browser cannot seek at all: it must download the whole
    # file before showing frame one.
    #
    # nginx serves ranges from static files by default. The two ways people
    # accidentally break it:
    #   1. gzipping the video (see below) — a compressed body cannot be ranged
    #   2. proxy_buffering off / a proxy in front that strips Accept-Ranges
    max_ranges 1;                  # one range per request; blocks the
                                   # multi-range amplification pattern

    # ---- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Text only. MP4 is already compressed — gzipping it burns CPU for roughly
    # zero saving AND disables range requests.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Prefer precompressed brotli if you generate it at build time
    # brotli_static on;

    # ---- The document --------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # ---- Hashed build assets -------------------------------------------------
    # Vite content-hashes these filenames, so the URL changes with the content.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---- Video ---------------------------------------------------------------
    # public/ files are NOT hashed by Vite. `immutable` is only safe because the
    # filename is versioned. Replacing the clip means a new filename.
    location ~* \.mp4$ {
        types { video/mp4 mp4; }
        default_type video/mp4;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges bytes always;

        # Large sequential reads: hand the file to the kernel instead of
        # copying it through nginx's userspace buffers.
        sendfile on;
        tcp_nopush on;
        aio threads;
        directio 8m;
        output_buffers 2 1m;

        access_log off;
    }

    # ---- Baseline ------------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
